name: Deploy production
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved frontend SHA
        required: true
      candidate_run_id:
        description: Verified prepare-production workflow run ID
        required: false
      artifact_sha256:
        description: Approved production-release.tgz SHA256
        required: false
      backend_sha:
        description: Deployed and verified backend SHA
        required: true
      routing_sha256:
        description: Approved live htaccess SHA256
        required: true
      toolbar_baseline:
        description: Verified live baseline JSON for the admin toolbar release without a catalog build
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: optika100-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      FRONTEND_SHA: ${{ inputs.expected_sha }}
      O100_BACKEND_SHA: ${{ inputs.backend_sha }}
      O100_ROUTING_SHA256: ${{ inputs.routing_sha256 }}
      O100_TOOLBAR_BASELINE: ${{ inputs.toolbar_baseline }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify inputs
        run: |
          [[ "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ && "$O100_BACKEND_SHA" =~ ^[a-f0-9]{40}$ && "$O100_ROUTING_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$FRONTEND_SHA"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.toolbar_baseline == '' }}
        with:
          name: production-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify approved artifact
        if: ${{ inputs.toolbar_baseline == '' }}
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" | sha256sum -c -
          tar -xOf production-release.tgz ./.release-sha | grep -Fx "$FRONTEND_SHA"
          tar -xOf production-release.tgz ./release-manifest.json > release-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("release-manifest.json")); if(m.backendSha!==process.env.O100_BACKEND_SHA || m.routingBaseline!==process.env.O100_ROUTING_SHA256) process.exit(1)'
          node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync("release-manifest.json")),log=fs.readFileSync("apache-production.log","utf8"); if(!log.includes(`PASS: Apache served all ${m.routeCount} manifest routes byte-for-byte;`)) throw new Error("Full Apache acceptance evidence is missing")'
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" > production-release.tgz.sha256
          node -e 'const fs=require("fs"); fs.writeFileSync("deploy/catalog-export.php", fs.readFileSync("scripts/catalog-content-fingerprint.php","utf8") + "\n" + fs.readFileSync("scripts/export-seo-inventory.php","utf8").replace(/^<\?php/,""))'
          tar -czf production-tools.tgz deploy
      - name: Configure verified SSH host keys
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/optika-production
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/optika-production ~/.ssh/known_hosts
      - name: Upload candidate and execute guarded switch
        if: ${{ inputs.toolbar_baseline == '' }}
        run: |
          ssh_opts=(-i ~/.ssh/optika-production -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p ~/o100-upload-$FRONTEND_SHA"
          scp "${ssh_opts[@]}" production-release.tgz production-release.tgz.sha256 production-tools.tgz "$SSH_USER@$SSH_HOST:~/o100-upload-$FRONTEND_SHA/"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "set -e; cd ~/o100-upload-$FRONTEND_SHA && sha256sum -c production-release.tgz.sha256 && tar -xzf production-tools.tgz && { (while sleep 15; do echo RELEASE_HEARTBEAT; done) & heartbeat=\$!; trap 'kill \$heartbeat 2>/dev/null || true' EXIT; O100_SMOKE_ORIGIN=https://optika100.com bash deploy/release.sh deploy '$PRODUCTION_ROOT' '$FRONTEND_SHA' '$O100_ROUTING_SHA256' production-release.tgz; }"
      - name: Release admin toolbar against the approved static storefront
        if: ${{ inputs.toolbar_baseline != '' }}
        run: |
          set -Eeuo pipefail
          read -r parent parent_manifest backend_manifest pause guard < <(jq -er '[.frontend, .frontendManifest, .backendManifest, .pause, .guard] | @tsv' <<< "$O100_TOOLBAR_BASELINE")
          [[ "$parent" =~ ^[a-f0-9]{40}$ ]]
          for hash in "$parent_manifest" "$backend_manifest" "$pause" "$guard"; do [[ "$hash" =~ ^[a-f0-9]{64}$ ]]; done
          bash -n deploy/release.sh
          php -l deploy/admin-toolbar-overlay.php && php -l deploy/accept-catalog-release.php && php -l deploy/verify-release.php
          node --check deploy/admin-toolbar.js
          docker run -d --name toolbar-apache -v "$PWD:/frontend:ro" php:8.1-apache bash -c 'a2enmod rewrite && apache2-foreground'
          for attempt in $(seq 1 30); do docker exec toolbar-apache curl -s http://127.0.0.1/ >/dev/null && break; sleep 1; done
          docker exec toolbar-apache bash /frontend/tests/apache-rehearsal.sh
          tar -czf production-tools.tgz deploy/{release.sh,verify-release.php,accept-catalog-release.php,admin-toolbar-overlay.php,admin-toolbar.js,production.htaccess,redirects.production.txt,merge-routing.php,link-unchanged.php,tar-extract.sh}
          tools_hash=$(sha256sum production-tools.tgz | cut -d' ' -f1)
          ssh_opts=(-i ~/.ssh/optika-production -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          stage="\$HOME/o100-toolbar-$FRONTEND_SHA"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir \"$stage\""
          scp "${ssh_opts[@]}" production-tools.tgz "$SSH_USER@$SSH_HOST:o100-toolbar-$FRONTEND_SHA/"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "set -e; cd \"$stage\"; printf '%s  production-tools.tgz\\n' '$tools_hash' | sha256sum -c -; tar -xzf production-tools.tgz; O100_SMOKE_ORIGIN=https://optika100.com O100_EXPECTED_FRONTEND='$parent' O100_PARENT_MANIFEST_SHA256='$parent_manifest' O100_BACKEND_SHA='$O100_BACKEND_SHA' O100_BACKEND_MANIFEST_SHA256='$backend_manifest' O100_EXPECTED_PAUSE_SHA256='$pause' O100_EXPECTED_1C_GUARD_SHA256='$guard' bash deploy/release.sh deploy-toolbar '$PRODUCTION_ROOT' '$FRONTEND_SHA' '$O100_ROUTING_SHA256'"
