name: Deploy production
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved frontend SHA
        required: false
      candidate_run_id:
        description: Verified prepare-production workflow run ID
        required: true
      parent_candidate_run_id:
        description: Optional override for resolving the published parent artifact
        required: false
      artifact_sha256:
        description: Approved production-release.tgz SHA256
        required: false
      backend_sha:
        description: Deployed and verified backend SHA
        required: false
      routing_sha256:
        description: Approved live htaccess SHA256
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: optika100-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      FRONTEND_SHA: ${{ inputs.expected_sha }}
      O100_BACKEND_SHA: ${{ inputs.backend_sha }}
      O100_ROUTING_SHA256: ${{ inputs.routing_sha256 }}
      O100_TRANSFER_RSYNC_SHA256: a8e24fdd6bcfd58ab582251d5f648997fc305cb847d0a1c14f5ac40ef2f460c1
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Verify candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .path == ".github/workflows/prepare-production.yml" and .head_branch == "main" and
            (.event == "workflow_dispatch" or .event == "workflow_run") and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/run.json"
      - uses: actions/download-artifact@v4
        with:
          name: production-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: approved
      - name: Resolve approved release
        id: source
        env:
          REQUESTED_HASH: ${{ inputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          cd approved
          digest=$(sha256sum production-release.tgz | cut -d' ' -f1)
          [[ "$(cat production-release.tgz.sha256)" == "$digest  production-release.tgz" ]]
          [[ -z "$REQUESTED_HASH" || "$REQUESTED_HASH" == "$digest" ]]
          tar -xOf production-release.tgz ./release-manifest.json > "$RUNNER_TEMP/manifest.json"
          sha=$(jq -er .frontendSha "$RUNNER_TEMP/manifest.json")
          backend=$(jq -er .backendSha "$RUNNER_TEMP/manifest.json")
          routing=$(jq -er .routingBaseline "$RUNNER_TEMP/manifest.json")
          parent=$(jq -er .parent candidate-parent.json)
          parent_hash=$(jq -er .manifest candidate-parent.json)
          [[ "$parent" =~ ^[a-f0-9]{40}$ && "$parent_hash" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$FRONTEND_SHA" || "$FRONTEND_SHA" == "$sha" ]]
          [[ -z "$O100_BACKEND_SHA" || "$O100_BACKEND_SHA" == "$backend" ]]
          [[ -z "$O100_ROUTING_SHA256" || "$O100_ROUTING_SHA256" == "$routing" ]]
          echo "ARTIFACT_SHA256=$digest" >> "$GITHUB_ENV"
          echo "APPROVED_PARENT=$parent" >> "$GITHUB_ENV"
          echo "APPROVED_PARENT_HASH=$parent_hash" >> "$GITHUB_ENV"
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$backend" =~ ^[a-f0-9]{40}$ && "$routing" =~ ^[a-f0-9]{64}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_SHA=$sha" >> "$GITHUB_ENV"
          echo "O100_BACKEND_SHA=$backend" >> "$GITHUB_ENV"
          echo "O100_ROUTING_SHA256=$routing" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm reviewed storefront history
        run: git -C source merge-base --is-ancestor HEAD origin/release/storefront
      - name: Verify approved artifact
        id: artifact
        working-directory: source
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          cp ../approved/{production-release.tgz,apache-production.log} .
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" | sha256sum -c -
          tar -xOf production-release.tgz ./.release-sha | grep -Fx "$FRONTEND_SHA"
          tar -xOf production-release.tgz ./release-manifest.json > release-manifest.json
          parent=$(jq -r '.codeOnly.parentSha // empty' release-manifest.json)
          if [[ -n "$parent" ]]; then [[ "$parent" =~ ^[a-f0-9]{40}$ ]]; fi
          [[ -z "$parent" || "$parent" == "$APPROVED_PARENT" ]]
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          node -e 'const m=JSON.parse(require("fs").readFileSync("release-manifest.json")); if(m.backendSha!==process.env.O100_BACKEND_SHA || m.routingBaseline!==process.env.O100_ROUTING_SHA256) process.exit(1)'
          node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync("release-manifest.json")),log=fs.readFileSync("apache-production.log","utf8"); if(!log.includes(`PASS: Apache served all ${m.routeCount} manifest routes byte-for-byte;`)) throw new Error("Full Apache acceptance evidence is missing")'
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" > production-release.tgz.sha256
          node -e 'const fs=require("fs"); fs.writeFileSync("deploy/catalog-export.php", fs.readFileSync("scripts/catalog-content-fingerprint.php","utf8") + "\n" + fs.readFileSync("scripts/export-seo-inventory.php","utf8").replace(/^<\?php/,""))'
          tar -czf production-tools.tgz deploy
      - name: Configure verified SSH host keys
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        working-directory: source
        run: |
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/optika-production
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/optika-production ~/.ssh/known_hosts
      - name: Recover interrupted transfer cleanup
        run: bash controller/scripts/remote-transfer.sh recover
      - name: Package changes against their published parent
        if: steps.artifact.outputs.parent != ''
        timeout-minutes: 20
        env:
          PARENT: ${{ steps.artifact.outputs.parent }}
          PARENT_RUN_OVERRIDE: ${{ inputs.parent_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          set -Eeuo pipefail
          parent_manifest=$(jq -er '.codeOnly.parentManifestSha256' release-manifest.json)
          [[ "$parent_manifest" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$PARENT_RUN_OVERRIDE" || "$PARENT_RUN_OVERRIDE" =~ ^[0-9]+$ ]]
          remote="$SSH_USER@$SSH_HOST"
          ssh_opts=(-i ~/.ssh/optika-production -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          parent_release="$PRODUCTION_ROOT/o100_frontend_releases/$PARENT"
          mkdir candidate published
          tar -xzf production-release.tgz -C candidate
          parent_run="$PARENT_RUN_OVERRIDE"
          if [[ -z "$parent_run" ]]; then
            parent_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
              -f "name=production-candidate-manifest-$parent_manifest" \
              --jq '[.artifacts[] | select(.expired == false) | .workflow_run.id][0] // empty')
          fi
          if [[ -z "$parent_run" ]]; then
            # Кандидаты старого workflow ещё не помечены хешем манифеста.
            parent_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-production.yml/runs" \
              -f "head_sha=$PARENT" -f status=success -F per_page=1 --jq '.workflow_runs[0].id // empty')
          fi
          if [[ "$parent_run" =~ ^[0-9]+$ ]] && \
              timeout 300s gh run download "$parent_run" --repo "$GITHUB_REPOSITORY" --name production-candidate --dir parent-artifact && \
              (cd parent-artifact && sha256sum -c production-release.tgz.sha256) && \
              [[ "$(tar -xOf parent-artifact/production-release.tgz ./release-manifest.json | sha256sum | cut -d' ' -f1)" == "$parent_manifest" ]]; then
            tar -xzf parent-artifact/production-release.tgz -C published
          elif [[ -n "$PARENT_RUN_OVERRIDE" ]]; then
            echo 'The specified parent candidate is missing or differs from the published manifest.' >&2
            exit 2
          else
            # После истечения артефакта читаем только статические файлы точного выпуска.
            ssh -C "${ssh_opts[@]}" "$remote" "set -e; echo '$parent_manifest  $parent_release/release-manifest.json' | sha256sum -c --status -; tar -cf - -C '$parent_release' ." \
              | tar -xf - -C published --no-same-owner --no-same-permissions
          fi
          printf '%s  published/release-manifest.json\n' "$parent_manifest" | sha256sum -c -
          cp published/release-manifest.json "$RUNNER_TEMP/parent.json"
          grep -Fx "$PARENT" published/.release-sha
          # Формат batch должен совпадать на обеих сторонах, даже при одинаковом протоколе.
          scp "${ssh_opts[@]}" "$remote:/usr/bin/rsync" transfer-rsync
          printf '%s  transfer-rsync\n' "$O100_TRANSFER_RSYNC_SHA256" | sha256sum -c -
          chmod 0700 transfer-rsync
          rsync_opts=(-rcz --delete --no-whole-file --protocol=30)
          ./transfer-rsync "${rsync_opts[@]}" --only-write-batch=changes.rsync candidate/ published/
          ./transfer-rsync "${rsync_opts[@]}" --read-batch=changes.rsync published/
          differences=$(rsync -rcni --delete candidate/ published/)
          test -z "$differences"
          xz -T2 -6 changes.rsync
          du -h changes.rsync.xz
      - uses: actions/upload-artifact@v4
        if: steps.artifact.outputs.parent != ''
        id: transfer
        with:
          name: production-transfer-${{ github.run_attempt }}
          path: source/changes.rsync.xz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Read Beget account disk allowance
        id: quota
        env:
          BEGET_API_LOGIN: ${{ secrets.BEGET_API_LOGIN }}
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: |
          available=$(python3 controller/scripts/beget-free-bytes.py)
          echo "bytes=$available" >> "$GITHUB_OUTPUT"
      - name: Check disk space before staging
        working-directory: source
        env:
          ACCOUNT_BYTES: ${{ steps.quota.outputs.bytes }}
          PARENT: ${{ steps.artifact.outputs.parent }}
        run: |
          set -Eeuo pipefail
          options=()
          if [[ -n "$PARENT" ]]; then options=(--parent "$RUNNER_TEMP/parent.json" --batch changes.rsync.xz); fi
          required=$(python3 ../controller/scripts/release-capacity.py production-release.tgz production-tools.tgz "${options[@]}")
          bytes=$(jq -er .bytes <<< "$required")
          files=$(jq -er .files <<< "$required")
          [[ "$ACCOUNT_BYTES" =~ ^[0-9]+$ ]]
          ssh -i ~/.ssh/optika-production -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "php8.1 /dev/stdin '$PRODUCTION_ROOT' '$bytes' '$files' '$ACCOUNT_BYTES'" < ../controller/deploy/check-release-capacity.php
      - name: Register private transfer directories
        id: staging
        run: bash controller/scripts/remote-transfer.sh start
      - name: Transfer and activate full release
        if: steps.artifact.outputs.parent == ''
        working-directory: source
        run: |
          set -Eeuo pipefail
          transfer=../controller/scripts/remote-transfer.sh
          tar -cf - production-tools.tgz production-release.tgz production-release.tgz.sha256 | bash "$transfer" receive
          bash "$transfer" activate full "$APPROVED_PARENT" "$APPROVED_PARENT_HASH" "$O100_BACKEND_SHA" "$O100_ROUTING_SHA256"
      - name: Transfer code changes and activate against their published parent
        if: steps.artifact.outputs.parent != ''
        timeout-minutes: 20
        env:
          PARENT: ${{ steps.artifact.outputs.parent }}
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ARTIFACT: ${{ steps.transfer.outputs.artifact-id }}
          TRANSFER_DIGEST: ${{ steps.transfer.outputs.artifact-digest }}
        working-directory: source
        run: |
          set -Eeuo pipefail
          transfer=../controller/scripts/remote-transfer.sh
          [[ "$TRANSFER_ARTIFACT" =~ ^[0-9]+$ && "$TRANSFER_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          tar -cf - production-tools.tgz | bash "$transfer" receive
          status=$(curl --silent --show-error --fail --max-time 20 --dump-header "$RUNNER_TEMP/transfer.headers" \
            --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$TRANSFER_ARTIFACT/zip")
          [[ "$status" == 302 ]]
          url=$(awk 'tolower($1) == "location:" {sub(/\r$/, ""); print $2}' "$RUNNER_TEMP/transfer.headers")
          [[ "$url" =~ ^https://[^[:space:]\"\\]+$ ]]
          echo "::add-mask::$url"
          printf 'url = "%s"\n' "$url" | bash "$transfer" download "$TRANSFER_DIGEST"
          bash "$transfer" activate delta "$PARENT" "$APPROVED_PARENT_HASH" "$O100_BACKEND_SHA" "$O100_ROUTING_SHA256" "$O100_TRANSFER_RSYNC_SHA256"
      - name: Clean this transfer
        if: always() && (steps.staging.outcome == 'success' || steps.staging.outcome == 'failure' || steps.staging.outcome == 'cancelled')
        run: bash controller/scripts/remote-transfer.sh finish
