name: Deploy production
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved frontend SHA
        required: true
      candidate_run_id:
        description: Verified prepare-production workflow run ID
        required: true
      artifact_sha256:
        description: Approved production-release.tgz SHA256
        required: true
      backend_sha:
        description: Deployed and verified backend SHA
        required: true
      routing_sha256:
        description: Approved live htaccess SHA256
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: optika100-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      FRONTEND_SHA: ${{ inputs.expected_sha }}
      O100_BACKEND_SHA: ${{ inputs.backend_sha }}
      O100_ROUTING_SHA256: ${{ inputs.routing_sha256 }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify inputs
        run: |
          [[ "$FRONTEND_SHA" =~ ^[a-f0-9]{40}$ && "$O100_BACKEND_SHA" =~ ^[a-f0-9]{40}$ && "$O100_ROUTING_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$FRONTEND_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: production-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify approved artifact
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" | sha256sum -c -
          tar -xOf production-release.tgz ./.release-sha | grep -Fx "$FRONTEND_SHA"
          tar -xOf production-release.tgz ./release-manifest.json > release-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("release-manifest.json")); if(m.backendSha!==process.env.O100_BACKEND_SHA || m.routingBaseline!==process.env.O100_ROUTING_SHA256) process.exit(1)'
          node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync("release-manifest.json")),log=fs.readFileSync("apache-production.log","utf8"); if(!log.includes(`PASS: Apache served all ${m.routeCount} manifest routes byte-for-byte;`)) throw new Error("Full Apache acceptance evidence is missing")'
          printf '%s  production-release.tgz\n' "$ARTIFACT_SHA256" > production-release.tgz.sha256
          tar -czf production-tools.tgz deploy
      - name: Configure verified SSH host keys
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/optika-production
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/optika-production ~/.ssh/known_hosts
      - name: Upload candidate and execute guarded switch
        run: |
          ssh -i ~/.ssh/optika-production -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "mkdir -p ~/o100-upload-$FRONTEND_SHA"
          scp -i ~/.ssh/optika-production -o StrictHostKeyChecking=yes production-release.tgz production-release.tgz.sha256 production-tools.tgz "$SSH_USER@$SSH_HOST:~/o100-upload-$FRONTEND_SHA/"
          ssh -i ~/.ssh/optika-production -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cd ~/o100-upload-$FRONTEND_SHA && sha256sum -c production-release.tgz.sha256 && tar -xzf production-tools.tgz && O100_SMOKE_ORIGIN=https://optika100.com bash deploy/release.sh deploy '$PRODUCTION_ROOT' '$FRONTEND_SHA' '$O100_ROUTING_SHA256' production-release.tgz"
