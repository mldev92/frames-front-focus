name: Roll back production
on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: SHA of the release being rolled back
        required: true
concurrency:
  group: optika100-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/storefront
          persist-credentials: false
      - name: Restore saved routing and previous frontend
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
        run: |
          [[ "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/optika-production
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/optika-production ~/.ssh/known_hosts
          ssh -i ~/.ssh/optika-production -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "set -e; tool=\$(mktemp); trap 'rm -f \"\$tool\"' EXIT; cat > \"\$tool\"; O100_EXPECTED_FRONTEND='$DEPLOYED_SHA' O100_SMOKE_ORIGIN=https://optika100.com bash \"\$tool\" rollback '$PRODUCTION_ROOT'" < deploy/release.sh
