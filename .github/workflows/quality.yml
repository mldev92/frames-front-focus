name: Observe production release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: Check public access and approved HTML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/observe-production.mjs --preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-observation-preflight
          path: production-observation.json
  observe:
    name: Observe approved production release for 60 minutes
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/observe-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-observation
          path: production-observation.json
