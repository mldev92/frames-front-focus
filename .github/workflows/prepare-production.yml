name: Prepare production candidate
on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Deployed backend SHA
        required: true
      backend_manifest:
        description: JSON manifest read from the deployed backend (SHA and file checksums)
        required: true
      routing_sha256:
        description: Inspected live htaccess SHA256
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      O100_BACKEND_SHA: ${{ inputs.backend_sha }}
      O100_ROUTING_SHA256: ${{ inputs.routing_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test && bun run test:unit
      - name: Validate inspected backend manifest
        env:
          BACKEND_MANIFEST: ${{ inputs.backend_manifest }}
        run: |
          node -e 'const m=JSON.parse(process.env.BACKEND_MANIFEST); if(m.sha!==process.env.O100_BACKEND_SHA || !Object.keys(m.files||{}).length) process.exit(1); require("fs").writeFileSync("backend-release.json",JSON.stringify(m))'
      - run: VITE_BITRIX_API=https://optika100.com VITE_VIRTUAL_TRY_ON=false bun run build:production
      - name: Package candidate
        env:
          O100_BACKEND_MANIFEST: backend-release.json
        run: |
          node scripts/package-production.mjs
          tar -czf production-release.tgz -C dist/client .
          sha256sum production-release.tgz > production-release.tgz.sha256
      - name: Rehearse complete artifact on isolated Apache
        run: |
          set -Eeuo pipefail
          docker run -d --name candidate-apache -p 127.0.0.1:8089:80 -v "$PWD:/frontend:ro" php:8.1-apache bash -c 'a2enmod rewrite && apache2-foreground'
          for attempt in $(seq 1 30); do docker exec candidate-apache curl -s http://127.0.0.1/ >/dev/null && break; sleep 1; done
          docker exec candidate-apache bash /frontend/tests/apache-rehearsal.sh | tee apache-rollback.log
          docker exec candidate-apache bash -c 'set -e; root=/var/www/html; baseline=$(sha256sum "$root/.htaccess" | cut -d" " -f1); php /frontend/deploy/merge-routing.php "$root/.htaccess" /frontend/deploy "$baseline" /tmp/candidate.htaccess; ln -s /frontend/dist/client "$root/o100_frontend_current"; cp /tmp/candidate.htaccess "$root/.htaccess"'
          node tests/production-apache.mjs | tee apache-production.log
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate
          retention-days: 30
          path: |
            production-release.tgz
            production-release.tgz.sha256
            dist/client/release-manifest.json
            generated/production-routes.json
            generated/seo-coverage.json
            apache-rollback.log
            apache-production.log
