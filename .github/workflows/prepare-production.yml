name: Prepare production candidate
on:
  workflow_dispatch:
    inputs:
      storefront_ref:
        description: Storefront branch or commit (main dispatches use release/storefront)
        required: false
      backend_sha:
        description: Deployed backend SHA
        required: true
      backend_manifest:
        description: JSON manifest read from the deployed backend (SHA and file checksums)
        required: true
      routing_sha256:
        description: Inspected live htaccess SHA256
        required: true
      api_snapshot_run_id:
        description: Reviewed workflow run containing production-api-snapshot
        required: false
      api_snapshot_sha256:
        description: SHA256 of the reviewed snapshot index.json
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-candidate-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    environment: production
    runs-on: ubuntu-latest
    env:
      O100_BACKEND_SHA: ${{ inputs.backend_sha }}
      O100_ROUTING_SHA256: ${{ inputs.routing_sha256 }}
      O100_API_SNAPSHOT: .o100-api-snapshots/reviewed
      O100_API_SNAPSHOT_SHA256: ${{ inputs.api_snapshot_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.storefront_ref || (github.ref_name == 'main' && 'release/storefront') || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Determine release mode
        id: plan
        env:
          SNAPSHOT_RUN: ${{ inputs.api_snapshot_run_id }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
        run: |
          set -Eeuo pipefail
          test -f scripts/build-code-only.mjs || { echo 'Select a maintained storefront ref with the production release tools.'; exit 2; }
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$SNAPSHOT_RUN" || -n "$O100_API_SNAPSHOT_SHA256" ]]; then
            [[ "$SNAPSHOT_RUN" =~ ^[0-9]+$ && "$O100_API_SNAPSHOT_SHA256" =~ ^[a-f0-9]{64}$ ]]
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production-read
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/production-read ~/.ssh/known_hosts
          remote="$SSH_USER@$SSH_HOST"
          ssh_opts=(-i ~/.ssh/production-read -o BatchMode=yes -o StrictHostKeyChecking=yes)
          parent=$(ssh "${ssh_opts[@]}" "$remote" "cat '$PRODUCTION_ROOT/o100_frontend_current/.release-sha'" | tail -1)
          [[ "$parent" =~ ^[a-f0-9]{40}$ ]]
          test "$(node scripts/storefront-release-mode.mjs "$parent")" = code-only || { echo 'Catalog or route inputs changed. Prepare with a reviewed catalog snapshot.'; exit 2; }
          hash=$(ssh "${ssh_opts[@]}" "$remote" "sha256sum '$PRODUCTION_ROOT/o100_frontend_releases/$parent/release-manifest.json'" | tail -1 | cut -d' ' -f1)
          [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          echo 'mode=code-only' >> "$GITHUB_OUTPUT"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          echo "O100_PARENT_MANIFEST_SHA256=$hash" >> "$GITHUB_ENV"
          echo "O100_PUBLISHED_DIR=$RUNNER_TEMP/published" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        if: steps.plan.outputs.mode == 'code-only'
        id: published
        with:
          path: dist/client
          key: storefront-published-v1-${{ steps.plan.outputs.parent }}
      - name: Read immutable production pages on a cold cache
        if: steps.plan.outputs.mode == 'code-only'
        env:
          PARENT: ${{ steps.plan.outputs.parent }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_ROOT: ${{ secrets.PRODUCTION_ROOT }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/client
          if ! printf '%s  dist/client/release-manifest.json\n' "$O100_PARENT_MANIFEST_SHA256" | sha256sum -c --status -; then
            rsync -rcz -e 'ssh -i ~/.ssh/production-read -o BatchMode=yes -o StrictHostKeyChecking=yes' \
              --include='*/' --include='*.html' --include='/release-manifest.json' --include='/robots.txt' --include='/sitemap.xml' --exclude='*' \
              "$SSH_USER@$SSH_HOST:$PRODUCTION_ROOT/o100_frontend_releases/$PARENT/" dist/client/
          fi
          rm -f ~/.ssh/production-read
          printf '%s  dist/client/release-manifest.json\n' "$O100_PARENT_MANIFEST_SHA256" | sha256sum -c -
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.mode == 'code-only' && steps.published.outputs.cache-hit != 'true'
        with:
          path: dist/client
          key: storefront-published-v1-${{ steps.plan.outputs.parent }}
      - if: steps.plan.outputs.mode == 'code-only'
        run: mv dist/client "$O100_PUBLISHED_DIR"
      - name: Download reviewed API snapshot
        if: steps.plan.outputs.mode == 'full'
        uses: actions/download-artifact@v4
        with:
          name: production-api-snapshot
          run-id: ${{ inputs.api_snapshot_run_id }}
          github-token: ${{ github.token }}
          path: .o100-api-snapshots/reviewed
      - run: bun run typecheck && bun run lint && bun run test && bun run test:unit
      - name: Validate inspected backend manifest
        env:
          BACKEND_MANIFEST: ${{ inputs.backend_manifest }}
        run: |
          node -e 'const m=JSON.parse(process.env.BACKEND_MANIFEST); if(m.sha!==process.env.O100_BACKEND_SHA || !Object.keys(m.files||{}).length) process.exit(1); const fs=require("fs"); fs.mkdirSync("generated",{recursive:true}); fs.writeFileSync("generated/backend-release.json",JSON.stringify(m))'
      - if: steps.plan.outputs.mode == 'full'
        run: |
          VITE_BITRIX_API=https://optika100.com VITE_VIRTUAL_TRY_ON=false bun run build:production
          O100_BACKEND_MANIFEST=generated/backend-release.json node scripts/package-production.mjs
      - if: steps.plan.outputs.mode == 'code-only'
        env:
          O100_BACKEND_MANIFEST: generated/backend-release.json
        run: node scripts/build-code-only.mjs
      - name: Package candidate
        id: package
        env:
          O100_BACKEND_MANIFEST: generated/backend-release.json
        run: |
          tar -czf production-release.tgz -C dist/client .
          sha256sum production-release.tgz > production-release.tgz.sha256
          echo "manifest=$(sha256sum dist/client/release-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          tar -czf production-tools.tgz deploy
          sha256sum production-tools.tgz > production-tools.tgz.sha256
      - name: Rehearse complete artifact on isolated Apache
        run: |
          set -Eeuo pipefail
          docker run -d --name candidate-apache -p 127.0.0.1:8089:80 -v "$PWD:/frontend:ro" php:8.1-apache bash -c 'a2enmod rewrite && apache2-foreground'
          for attempt in $(seq 1 30); do docker exec candidate-apache curl -s http://127.0.0.1/ >/dev/null && break; sleep 1; done
          docker exec candidate-apache bash /frontend/tests/apache-rehearsal.sh | tee apache-rollback.log
          docker exec candidate-apache bash -c 'set -e; root=/var/www/html; baseline=$(sha256sum "$root/.htaccess" | cut -d" " -f1); php /frontend/deploy/merge-routing.php "$root/.htaccess" /frontend/deploy "$baseline" /tmp/candidate.htaccess; ln -sfnT /frontend/dist/client "$root/o100_frontend_current"; cp /tmp/candidate.htaccess "$root/.htaccess"'
          node tests/production-apache.mjs | tee apache-production.log
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.mode == 'code-only'
        with:
          path: dist/client
          key: storefront-published-v1-${{ steps.plan.outputs.source }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-checksum
          path: production-release.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate
          retention-days: 30
          path: |
            production-release.tgz
            production-release.tgz.sha256
            production-tools.tgz
            production-tools.tgz.sha256
            dist/client/release-manifest.json
            generated/production-routes.json
            generated/seo-coverage.json
            generated/api-snapshot-build.json
            apache-rollback.log
            apache-production.log
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-manifest-${{ steps.package.outputs.manifest }}
          retention-days: 30
          path: dist/client/release-manifest.json
